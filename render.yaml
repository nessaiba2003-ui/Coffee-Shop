# Creates billable resources only after approval in the Render dashboard.
# Review the displayed prices before applying this Blueprint.
services:
  - type: web
    name: velora-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: velora-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: velora-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: velora-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: velora-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: velora-db
          property: password
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=65.0 -Duser.timezone=UTC"
databases:
  - name: velora-db
    plan: basic-256mb
    region: frankfurt
    databaseName: velora
    user: velora
    ipAllowList: []
